<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{url_for('static', filename='css/index.css')}}">
    <title>Home</title>
</head>
<body>
    <main class="index-page">
        <h1 class="Title">
            LifeHub
        </h1>

        <div class="card-container"> 
            
            {% for task in tasks %}
            <div class="card">
                <h2>{{ task.title}}</h2>
                <p>{{ task.subject}}</p>
            </div>
            {% endfor %}

        </div>
        
        <a href="{{ url_for('task')}}" class="view-all-btn">
            View All
        </a>
    </main>
</body>
</html>
